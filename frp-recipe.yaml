$engine: 3
$onesync: on
name: Faroeste
version: 1.0.5
author: Klandestino
description: An advanced RedM RP framework!

variables:
    steamApiKey : none
    discord_webhook_for_logs : DISCORD_WEBHOOK_HERE
    discord_guild_id : none
    discord_bot_token : none
    frp_language : en
    server_locale : en-US
    load_server_icon : Faroeste.png
    sv_enforceGameBuild : 1491
    datadog_key : none
    datadog_hostname : none
    datadog_site : datadoghq.com
    db_host : localhost
    db_name : frp
    db_username : root
    db_password : none
tasks:
#  Download Base Files
  - action: download_github
    src: https://github.com/Faroeste-Roleplay/txAdminRecipe
    ref: main
    dest: ./tmp/FRP_txAdminRecipe
  
  - action: move_path
    src: ./tmp/FRP_txAdminRecipe/server.cfg
    dest: ./server.cfg
  
  - action: move_path
    src: ./tmp/FRP_txAdminRecipe/Faroeste.png
    dest: ./Faroeste.png

# Prepare Database
  - action: connect_database
  - action: query_database
    query: |      
      DROP DATABASE IF EXISTS `{{dbName}}`;
      CREATE DATABASE IF NOT EXISTS `{{dbName}}`;
  
  # - action: query_database
  #   file: ./tmp/FRP_txAdminRecipe/db.sql

# STANDALONE CFX
  - action: download_github
    src: https://github.com/citizenfx/cfx-server-data
    subpath: resources
    dest: ./resources/[cfx-default]    
    
# ox_side    
  - action: download_file
    url: https://github.com/Faroeste-Roleplay/oxmysql/releases/latest/download/oxmysql.zip
    path: ./tmp/oxmysql.zip
  
  - action: unzip
    dest: ./resources/[ox]/
    src: ./tmp/oxmysql.zip

  - action: download_file
    url: https://github.com/Faroeste-Roleplay/ox_lib/releases/latest/download/ox_lib.zip
    path: ./tmp/ox_lib.zip
  - action: unzip
    dest: ./resources/[ox]/
    src: ./tmp/ox_lib.zip
    
  - action: download_file
    url: https://github.com/Faroeste-Roleplay/ox_target/releases/latest/download/ox_target.zip
    path: ./tmp/ox_target.zip
  
  - action: unzip
    dest: ./resources/[ox]/
    src: ./tmp/ox_target.zip

# faroeste side  
  - action: download_github
    src: https://github.com/Faroeste-Roleplay/frp_logs
    ref: main
    dest : ./resources/[faroeste]/frp_logs    
  
  - action: download_github
    src: https://github.com/Faroeste-Roleplay/frp_lib
    ref: main
    dest : ./resources/[faroeste]/frp_lib

  - action: download_github
    src: https://github.com/Faroeste-Roleplay/frp_game_events
    ref: main
    dest : ./resources/[faroeste]/frp_game_events

  # yazı değiştirelim
  - action: replace_string
    file: ./resources/[faroeste]/frp_logs/config.lua
    search: "DISCORD_WEBHOOK_HERE"
    replace : "{{discord_webhook_for_logs}}"


  - action: download_github
    src: https://github.com/Faroeste-Roleplay/frp_core
    ref: main
    dest: ./resources/[faroeste]/frp_core

  - action: query_database
    file: ./resources/[faroeste]/frp_core/db.sql

  - action: download_github
